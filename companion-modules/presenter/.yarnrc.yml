# The repository root is a Yarn workspace project of its own. This module is
# deliberately not a member of it — different module system, different Node
# target, and its dependencies must never hoist into the Electron app's tree.
# Declaring the linker here keeps a nested `yarn install` from inheriting the
# parent project's resolution settings.
nodeLinker: node-modules

# The empty `yarn.lock` beside this file is load-bearing: it is how Yarn is
# told this folder is a project in its own right rather than a stray package
# inside the repository root's workspace, which it otherwise refuses to install.
